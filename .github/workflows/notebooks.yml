name: Notebook docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-notebooks:
    name: Build notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,test]"

      - name: Execute notebooks
        run: >
          jupyter nbconvert
          --to notebook
          --execute
          --inplace
          --ExecutePreprocessor.timeout=120
          docs/notebooks/*.ipynb

      - name: Build notebook HTML
        run: |
          mkdir -p site/notebooks
          jupyter nbconvert --to html --output-dir site/notebooks docs/notebooks/*.ipynb
          cp docs/notebooks/README.md site/notebooks/README.md
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>pyling notebook examples</title>
            <style>
              body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; line-height: 1.5; }
              h1 { margin-bottom: 0.25rem; }
              ul { padding-left: 1.25rem; }
              a { color: #0645ad; }
            </style>
          </head>
          <body>
            <h1>pyling notebook examples</h1>
            <p>Executable examples for RDFLib integration, runtime OWL-style rules, and neuro-symbolic validation.</p>
            <ul>
              <li><a href="notebooks/01-rdflib-reasoning.html">RDFLib graphs with pyling</a></li>
              <li><a href="notebooks/02-owl-style-rules.html">OWL-style materialization with runtime N3 rules</a></li>
              <li><a href="notebooks/03-neuro-symbolic-validation.html">Neuro-symbolic validation over extracted knowledge</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Upload notebook HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-site
          path: site

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-notebooks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
