name: Notebook docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-notebooks:
    name: Build notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,test]"

      - name: Execute notebooks
        run: >
          jupyter nbconvert
          --to notebook
          --execute
          --inplace
          --ExecutePreprocessor.timeout=120
          docs/notebooks/*.ipynb

      - name: Build notebook HTML
        run: |
          mkdir -p site/notebooks site/assets
          jupyter nbconvert \
            --to html \
            --template eyereasoner \
            --TemplateExporter.extra_template_basedirs=docs/notebooks \
            --output-dir site/notebooks \
            docs/notebooks/*.ipynb
          cp docs/notebooks/index.html site/index.html
          cp docs/notebooks/eyereasoner.css site/assets/eyereasoner.css
          cp docs/notebooks/README.md site/notebooks/README.md

      - name: Upload notebook HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-site
          path: site

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-notebooks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
