name: Performance comparison

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-comparison:
    name: pyling vs Eyeling and FuXi
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Eyeling
        uses: actions/checkout@v4
        with:
          repository: eyereasoner/eyeling
          path: .cache/eyeling

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Run examples comparison
        run: >
          python tools/compare_reasoners.py
          --suite=examples
          --reasoner=pyling,eyeling,fuxi
          --eyeling-path=.cache/eyeling
          --iterations=1
          --warmup=0
          --max-iterations=100000
          --timeout=600
          --allow-failures
          --require-reasoner=eyeling
          --require-reasoner=fuxi
          --report-dir=performance-reports/examples
          --markdown

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Examples"
            cat performance-reports/examples/report.md || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: performance-reports
